set -g default-terminal "screen-256color"
set -g status-bg black
set -g status-fg green
set -g mouse on

set -g history-limit 1000000

#-------------------------------------------------------#
# Miscellaneous Starter Binds
#-------------------------------------------------------#
#change prefix from C-b to C-a
unbind C-b
set -g prefix C-a

#bind C-a C-a to last window which was originally prefix + l
bind C-a last-window

# reload tmux.conf message
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# start with window 1 (instead of 0)
set -g base-index 1

# start with pane 1
set -g pane-base-index 1

# use vi mode
setw -g mode-keys vi
set -g status-keys vi

# Allow space to be repeated to cycle layouts
bind -r Space next-layout

# re-bind x and & to remove kill confirmation
bind-key & kill-window
bind-key x kill-pane

#-------------------------------------------------------#
# Useful Tmux Commands (notes to self)
#-------------------------------------------------------#
# prefix + z to zoom current pane to fullscreen in window (prefix + z to exit)
# prefix + ! to break current pane to separate window
# prefix + w view the window tree
# prefix + s view the session tree

#-------------------------------------------------------#
# PANE/WINDOW NAVIGATION/MANAGEMENT
#-------------------------------------------------------#
# prefix + c to open a new window in current path
bind c new-window -c '#{pane_current_path}'
# prefix + C to open a new window and prompt for name
bind C command-prompt -p "New window name:" "new-window -n '%%' -c '#{pane_current_path}'"

# prefix + R (capital R) to renumber windows sequentially
bind R move-window -r \; display "Windows renumbered!"

# splitting panes
bind \\ split-window -h -c '#{pane_current_path}' # Split window vertically
bind - split-window -v -c '#{pane_current_path}' # Split window horizontally
bind Q split-window -v -c '#{pane_current_path}' \; split-window -h -c '#{pane_current_path}' \; select-pane -t top-left \; split-window -h -c '#{pane_current_path}' \; select-pane -t top-left # Split window into quad panes

# Use Alt-vim keys WITHOUT PREFIX KEY to switch panes
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Use Alt+capital_vim to flip orientation of the current pane with the pane in vim-direction
bind -n M-H move-pane -t '.{left-of}'
bind -n M-L move-pane -t '.{right-of}'
bind -n M-K move-pane -h -t '.{up-of}'
bind -n M-J move-pane -h -t '.{down-of}'

# prefix + e to toggle broadcast typing in (e)very pane in window
bind e setw synchronize-panes
# prefix + E to prompt for a command and send it to all panes in the current session
# warning that this runs ctrl-c in every pane first to ensure they are in insert mode and the lines are cleared.
bind E command-prompt -p "Command to all panes:" \
       "run \"tmux list-panes -s -F '##{pane_id}' | xargs -I {} sh -c 'tmux send-keys -t {} C-c; sleep 0.1; tmux send-keys -t {} \\\"%1\\\" Enter'\""

# Pane resizing with prefix + vim (repeatable)
bind -r j resize-pane -D 2
bind -r k resize-pane -U 2
bind -r h resize-pane -L 2
bind -r l resize-pane -R 2

#-------------------------------------------------------#
#Pane copy/pasting
#-------------------------------------------------------#
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "xclip -i -f -selection primary | xclip -i -selection clipboard"
bind C-v paste-buffer

# Jump to previous prompt in copy mode ( prefix + [ )
# The character at the end of prompt is a non-breaking space. Insert with: ctrl-k <space><space>.
# Verify in normal mode with ga. Used for jumping to previous prompt in tmux with p.   " "
bind-key -T copy-mode-vi 'p' send-keys -X start-of-line\; send-keys -X search-backward " "

#-------------------------------------------------------#
#Setting escape time delay to be smaller
#to make tmux more responsive to commands
#-------------------------------------------------------#
set -s escape-time 1

